name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: toolzcraft_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/toolzcraft_test
      BILLING_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/toolzcraft_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - run: pnpm test:new-tools && pnpm test:adopted-tools && pnpm test:release && pnpm test:document-workflows && node --test scripts/check-admin-audit.test.cjs && pnpm test:media
      - run: node scripts/database.cjs migrate
      - run: node scripts/database.cjs migrate
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm build:local
      - run: node scripts/create-test-fixtures.cjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-results
          path: test-results/

  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t toolzcraft-api:test .
      - name: Verify API container starts without development dependencies
        run: |
          docker run -d --name api-test -p 127.0.0.1:5080:8080 -e DATABASE_URL=postgresql://test:test@127.0.0.1:5432/test -e APP_ORIGIN=https://staging.example.com -e FIREBASE_PROJECT_ID=container-smoke-test toolzcraft-api:test
          trap 'docker logs api-test; docker rm -f api-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/api/healthz; then exit 0; fi
            sleep 2
          done
          exit 1
