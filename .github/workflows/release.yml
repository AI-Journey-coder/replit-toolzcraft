name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: toolzcraft_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/toolzcraft_test
      BILLING_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/toolzcraft_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - run: pnpm test:new-tools && pnpm test:adopted-tools && pnpm test:release && pnpm test:document-workflows && node --test scripts/check-admin-audit.test.cjs && pnpm test:media
      - run: node scripts/database.cjs migrate
      - run: node scripts/database.cjs migrate
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm build:local
      - run: node scripts/create-test-fixtures.cjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-results
          path: test-results/
